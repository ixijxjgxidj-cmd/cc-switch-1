name: Build Windows cc-switch.exe

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 cc-switch.exe
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml || echo "1.95")
          echo "channel=${channel:-1.95}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build:renderer

      - name: Build backend binary with Cargo
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-bin | Out-Null
          $src = "src-tauri/target/release/cc-switch.exe"
          if (Test-Path $src) {
            Copy-Item $src dist-bin/cc-switch.exe
            Write-Host "Success: cc-switch.exe found and copied to dist-bin/"
          } else {
            throw "cc-switch.exe not found at $src"
          }

      - name: Upload cc-switch.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-patched-windows-x64
          path: dist-bin/cc-switch.exe
          if-no-files-found: error
